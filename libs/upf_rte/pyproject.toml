[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upf_rte"
version = "0.0.1"
description = "Unscented Particle Filter for relative pose estimation using odometry and UWB measurements"
readme = "README.md"
license = {text = "GPL3"}
authors = [
    {name = "Yuri Durodie", email = "yuri.durodie@vub.be"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "filterpy",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]
